name: Publish BOXIS website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Extract and validate website
        run: |
          mkdir -p site
          unzip -q boxis-web-nueva.zip -d site
          test -f site/boxis-web-nueva/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/boxis-web-nueva

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
